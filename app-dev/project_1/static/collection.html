<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Collection · Maison Livre</title><link rel="stylesheet" href="/static/style.css"></head><body>
<header class="topbar"><a class="brand" href="/">MAISON LIVRE</a><nav class="nav"><a href="/">Home</a><a href="/collection">Collection</a><a href="/donate">Donate</a></nav></header>
<main class="container"><div class="page-head"><div class="eyebrow">The Private Archive</div><h2>La Collection</h2><p class="hint">서가에 머무는 한 권의 책을 찾아보세요.</p></div><section class="panel">
<div class="form-grid"><div class="field"><label>Book Title</label><input id="title" maxlength="50" placeholder="책 제목"></div><div class="field"><label>Author</label><input id="author" maxlength="30" placeholder="저자"></div><div class="field"><label>Published Year</label><input id="year" inputmode="numeric" placeholder="예: 2024"></div></div>
<div class="actions"><button class="btn" id="searchBtn">SEARCH THE ARCHIVE</button><button class="btn secondary" id="resetBtn">RESET</button></div><div id="message" class="message"></div><div id="result"></div></section></main><footer>MAISON LIVRE · THE PRIVATE ARCHIVE</footer>
<script>
const currentYear=new Date().getFullYear(),result=document.getElementById('result'),message=document.getElementById('message'),title=document.getElementById('title'),author=document.getElementById('author'),year=document.getElementById('year');let allBooks=[],currentPage=1;const booksPerPage=7;
function show(s){message.textContent=s;message.className='message error';return false}function validate(){const t=title.value.trim(),a=author.value.trim(),y=year.value.trim();message.textContent='';message.className='message';if(t.length>50)return show('책 제목은 1글자 이상 50글자 이하로 입력해 주세요.');if(a.length>30)return show('저자명은 1글자 이상 30글자 이하로 입력해 주세요.');if(y&&(!/^\d+$/.test(y)||Number(y)<1950||Number(y)>currentYear))return show(`출판연도는 1950년 이상 ${currentYear}년 이하의 정수로 입력해 주세요.`);return true}
async function search(){if(!validate())return;const p=new URLSearchParams();if(title.value.trim())p.set('title',title.value.trim());if(author.value.trim())p.set('author',author.value.trim());if(year.value.trim())p.set('year',year.value.trim());try{const r=await fetch('/books/search?'+p);if(!r.ok)throw new Error();allBooks=await r.json();currentPage=1;render()}catch(e){show('컬렉션을 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.')}}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}function render(){if(!allBooks.length){result.innerHTML='<div class="empty">조건에 맞는 도서를 찾지 못했습니다.</div>';return}const start=(currentPage-1)*booksPerPage,pageBooks=allBooks.slice(start,start+booksPerPage);result.innerHTML='<ul class="book-list">'+pageBooks.map(b=>`<li class="book" onclick="location.href='/book/${b.id}'"><div class="book-no">Nº ${String(b.id).padStart(3,'0')}</div><div><div class="book-title">${esc(b.title)}</div><div class="book-meta">${esc(b.author)} · ${esc(b.category)}</div></div><div class="book-meta">${b.year}</div><div class="discover">DISCOVER →</div></li>`).join('')+'</ul><div id="pagination" class="pagination"></div>';renderPagination()}
function renderPagination(){const p=document.getElementById('pagination'),total=Math.ceil(allBooks.length/booksPerPage);const add=(text,page,disabled,active=false)=>{const b=document.createElement('button');b.className='page-btn'+(active?' active':'');b.textContent=text;b.disabled=disabled;b.onclick=()=>{currentPage=page;render();window.scrollTo({top:300,behavior:'smooth'})};p.appendChild(b)};add('← PREV',currentPage-1,currentPage===1);for(let i=1;i<=total;i++)add(i,i,false,i===currentPage);add('NEXT →',currentPage+1,currentPage===total)}
searchBtn.onclick=search;resetBtn.onclick=()=>{title.value='';author.value='';year.value='';message.textContent='';search()};[title,author,year].forEach(el=>el.addEventListener('keydown',e=>{if(e.key==='Enter')search()}));search();
</script></body></html>
