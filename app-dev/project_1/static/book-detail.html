<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Book · Maison Livre</title><link rel="stylesheet" href="/static/style.css"></head><body>
<header class="topbar"><a class="brand" href="/">MAISON LIVRE</a><nav class="nav"><a href="/">Home</a><a href="/collection">Collection</a><a href="/donate">Donate</a></nav></header>
<main class="detail-wrap"><article class="detail" id="detail"><div class="eyebrow">The Collection</div><h2>책을 불러오는 중입니다.</h2></article></main><footer>MAISON LIVRE · BOOK ARCHIVE</footer>
<script>
const id=location.pathname.split('/').filter(Boolean).pop(),box=document.getElementById('detail');const esc=s=>{const d=document.createElement('div');d.textContent=s??'';return d.innerHTML};
fetch('/api/books/'+id).then(async r=>{if(!r.ok)throw new Error();return r.json()}).then(b=>{document.title=b.title+' · Maison Livre';box.innerHTML=`<div class="eyebrow">Nº ${String(b.id).padStart(3,'0')} · ${esc(b.category)}</div><div class="monogram" style="margin:0 auto 35px">ML</div><h1 class="detail-title">${esc(b.title)}</h1><div class="detail-author">${esc(b.author)}</div><div class="ornament" style="justify-content:center"><span>◆</span></div><hr class="detail-rule"><div class="detail-grid"><div class="detail-label">Published</div><div>${b.year}</div><div class="detail-label">About the book</div><div class="detail-description">${esc(b.description)||'이 책에는 아직 별도의 소개가 등록되지 않았습니다.'}</div></div><hr class="detail-rule"><a class="btn secondary" href="/collection">← RETURN TO THE COLLECTION</a>`}).catch(()=>box.innerHTML='<div class="eyebrow">Not Found</div><h2>도서를 찾을 수 없습니다.</h2>');
</script></body></html>
