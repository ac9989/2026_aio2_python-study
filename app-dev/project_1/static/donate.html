<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Donate · Maison Livre</title><link rel="stylesheet" href="/static/style.css"></head><body>
<header class="topbar"><a class="brand" href="/">MAISON LIVRE</a><nav class="nav"><a href="/">Home</a><a href="/collection">Collection</a><a href="/donate">Donate</a></nav></header>
<main class="container"><div class="page-head"><div class="eyebrow">The Offering</div><h2>Pass A Story On</h2><p class="donate-note">한 사람의 서가를 떠난 책이 또 다른 사람의 기억이 됩니다.</p></div><section class="panel">
<div class="form-grid"><div class="field"><label>Book Title</label><input id="title" maxlength="50" placeholder="책 제목"></div><div class="field"><label>Author</label><input id="author" maxlength="30" placeholder="저자"></div><div class="field"><label>Published Year</label><input id="year" inputmode="numeric" placeholder="예: 2024"></div><div class="field"><label>Category</label><input id="category" maxlength="30" placeholder="예: 소설, 프로그래밍"></div><div class="field full"><label>About This Book</label><textarea id="description" maxlength="1000" placeholder="다음 독자에게 이 책을 소개해 주세요."></textarea></div></div>
<div class="actions"><button class="btn" id="donateBtn">OFFER THIS BOOK</button></div><div id="message" class="message"></div></section></main><footer>MAISON LIVRE · PASS A STORY ON</footer>
<script>
const currentYear=new Date().getFullYear(),message=document.getElementById('message'),title=document.getElementById('title'),author=document.getElementById('author'),year=document.getElementById('year'),category=document.getElementById('category'),description=document.getElementById('description');function msg(s,type='error'){message.textContent=s;message.className='message '+type}
async function donate(){const t=title.value.trim(),a=author.value.trim(),y=year.value.trim();if(t.length<1||t.length>50)return msg('책 제목은 1글자 이상 50글자 이하로 입력해 주세요.');if(a.length<1||a.length>30)return msg('저자명은 1글자 이상 30글자 이하로 입력해 주세요.');if(!/^\d+$/.test(y)||Number(y)<1950||Number(y)>currentYear)return msg(`출판연도는 1950년 이상 ${currentYear}년 이하의 정수로 입력해 주세요.`);try{const r=await fetch('/books',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:t,author:a,year:Number(y),category:category.value.trim()||'기증 도서',description:description.value.trim()})});const data=await r.json();if(!r.ok)return msg(data.detail||'도서를 등록하지 못했습니다.');msg(data.message,'success');title.value='';author.value='';year.value='';category.value='';description.value=''}catch(e){msg('서버에 연결할 수 없습니다. 잠시 후 다시 시도해 주세요.')}}
donateBtn.onclick=donate;
</script></body></html>
